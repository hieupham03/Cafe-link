name: CafeLink V8 verification
on:
  push:
    paths: ['cafelink-system/**', '.github/workflows/cafelink-v8.yml', 'dist/CafeLink-Original-1.0.0-Baseline.zip']
  pull_request:
    paths: ['cafelink-system/**', '.github/workflows/cafelink-v8.yml', 'dist/CafeLink-Original-1.0.0-Baseline.zip']
  workflow_dispatch:
    inputs:
      full_experiments:
        description: 'Run full 120-case campaign and 1/5/10/14-client measurements'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cafelink-v8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: cafelink-system
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: cafelink-system/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cafelink-system/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cafelink-system/tools/requirements-v8.txt
      - name: Install measurement plotting dependency
        run: python -m pip install -r tools/requirements-v8.txt
      - name: Verify source layout and preserved baseline
        run: |
          if (-not (Test-Path ../dist/CafeLink-Original-1.0.0-Baseline.zip)) { throw 'Include the sealed baseline ZIP in the repository before enabling CI; never recreate it from current sources.' }
      - name: Verify Java, browser and measurements
        env:
          CAFELINK_FULL_EXPERIMENTS: ${{ inputs.full_experiments }}
        run: |
          $v8Args=@('-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/test-v8.ps1')
          if ($env:CAFELINK_FULL_EXPERIMENTS -ne 'true') { $v8Args+='-Quick' }
          & powershell @v8Args
          exit $LASTEXITCODE
      - name: Upload allowlisted results even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cafelink-v8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report/evidence/cafelink-v2/v8/**
            report/evidence/cafelink-v2/v8-gate/**
            report/evidence/cafelink-v2/v9.3-gate/**
          if-no-files-found: warn
          retention-days: 14
